<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zam – Warteliste</title>
<meta name="description" content="Offene Spiele in München. Mitspieler finden, Platz teilen.">
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;padding:24px;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:#0f172a;
    background:radial-gradient(60vmax 60vmax at 15% 10%,#cfe3ff 0,transparent 60%),
               radial-gradient(50vmax 50vmax at 90% 90%,#d9f5e6 0,transparent 60%),#f5f7fb}
  .card{width:100%;max-width:440px;padding:36px 28px;border-radius:28px;text-align:center;
    background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);
    backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:0 20px 60px rgba(15,23,42,.08),inset 0 1px 0 rgba(255,255,255,.8)}
  .count{font-size:56px;font-weight:650;letter-spacing:-.03em;line-height:1}
  .sub{color:#475569;margin:8px 0 28px}
  form{display:flex;gap:8px;padding:6px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8)}
  input{flex:1;min-width:0;border:0;background:transparent;padding:10px 14px;font:inherit;outline:none}
  button{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;color:#fff;background:#0f172a;cursor:pointer}
  button:disabled{opacity:.5}
  .msg{min-height:24px;margin-top:14px;font-size:14px;color:#475569}
  h1{font-size:15px;font-weight:600;color:#334155;margin-top:28px}
  p.info{font-size:14px;color:#64748b}
</style>
</head>
<body>
<main class="card">
  <div class="count" id="count">–</div>
  <div class="sub">auf der Warteliste</div>
  <form id="f">
    <input type="email" name="email" placeholder="deine@mail.de" required autocomplete="email">
    <button>Eintragen</button>
  </form>
  <div class="msg" id="msg"></div>
  <h1>Zam</h1>
  <p class="info">Offene Spiele in München. Du meldest dich allein an, wir füllen das Team auf.</p>
</main>
<script>
  const c=document.getElementById('count'),m=document.getElementById('msg'),f=document.getElementById('f');
  fetch('/api/count').then(r=>r.json()).then(d=>{if(typeof d.count==='number')c.textContent=d.count}).catch(()=>{});
  f.onsubmit=async e=>{
    e.preventDefault();const b=f.querySelector('button');b.disabled=true;m.textContent='';
    try{
      const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.email.value})});
      const d=await r.json();
      if(r.ok){m.textContent=d.existing?'Du bist schon eingetragen.':'Du bist dabei.';if(!d.existing&&c.textContent!=='–')c.textContent=+c.textContent+1;f.reset()}
      else m.textContent=d.error||'Hat nicht geklappt.';
    }catch{m.textContent='Hat nicht geklappt.'}
    b.disabled=false;
  };
</script>
</body>
</html>
